name: Install Godot export templates
description: Install and optionally cache export templates matching a Godot editor version.
inputs:
  godot_version:
    description: Godot version, for example 4.7.2.
    required: false
    default: '4.7.2'
  dotnet:
    description: Use the Mono export-template archive and directory.
    required: false
    default: 'false'
  cache:
    description: Cache installed export templates.
    required: false
    default: 'true'
runs:
  using: composite
  steps:
    - name: Cache Godot export templates
      id: templates-cache
      if: inputs.cache == 'true'
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: ~/.local/share/godot/export_templates
        key: ${{ runner.os }}-godot-templates-${{ inputs.godot_version }}-${{ inputs.dotnet }}

    - name: Install matching export templates
      if: inputs.cache != 'true' || steps.templates-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        GODOT_VERSION: ${{ inputs.godot_version }}
        GODOT_DOTNET: ${{ inputs.dotnet }}
      run: |
        set -euo pipefail

        if [[ "$GODOT_DOTNET" == "true" ]]; then
          archive_name="Godot_v${GODOT_VERSION}-stable_mono_export_templates.tpz"
          template_dir="${GODOT_VERSION}.stable.mono"
        else
          archive_name="Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          template_dir="${GODOT_VERSION}.stable"
        fi

        base="https://godot-releases.nbg1.your-objectstorage.com/${GODOT_VERSION}-stable"
        archive="$RUNNER_TEMP/godot-templates.tpz"
        unpacked="$RUNNER_TEMP/godot-templates"
        target="$HOME/.local/share/godot/export_templates/$template_dir"

        curl -fL --retry 3 "$base/$archive_name" -o "$archive"
        rm -rf "$unpacked"
        mkdir -p "$unpacked" "$target"
        unzip -q "$archive" -d "$unpacked"
        cp -R "$unpacked/templates/." "$target/"

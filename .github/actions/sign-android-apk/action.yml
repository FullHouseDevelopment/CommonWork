name: Sign Android APK
description: Align, sign, and verify an Android APK using either a base64 keystore or PEM certificate/private-key material.
inputs:
  apk:
    description: Input APK path.
    required: true
  output:
    description: Signed APK output path.
    required: true
  keystore_base64:
    description: Optional base64-encoded Android keystore.
    required: false
    default: ''
  key_alias:
    description: Keystore key alias.
    required: false
    default: ''
  keystore_password:
    description: Keystore password.
    required: false
    default: ''
  key_password:
    description: Key password.
    required: false
    default: ''
  certificate_pem:
    description: PEM certificate contents or base64-encoded PEM when not using a keystore.
    required: false
    default: ''
  private_key_pem:
    description: PEM private key contents or base64-encoded PEM when not using a keystore.
    required: false
    default: ''
  private_key_password:
    description: Optional PEM private-key password.
    required: false
    default: ''
  expected_cert_sha256:
    description: Optional expected signer certificate SHA-256 digest.
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Prepare Android signing material
      shell: bash
      env:
        KEYSTORE_BASE64: ${{ inputs.keystore_base64 }}
        KEY_ALIAS: ${{ inputs.key_alias }}
        KEYSTORE_PASSWORD: ${{ inputs.keystore_password }}
        KEY_PASSWORD: ${{ inputs.key_password }}
        CERTIFICATE_PEM: ${{ inputs.certificate_pem }}
        PRIVATE_KEY_PEM: ${{ inputs.private_key_pem }}
        PRIVATE_KEY_PASSWORD: ${{ inputs.private_key_password }}
      run: |
        set -euo pipefail

        native_path() {
          if [[ "${RUNNER_OS:-}" == "Windows" ]] && command -v cygpath >/dev/null 2>&1; then
            cygpath -w "$1"
          else
            printf '%s' "$1"
          fi
        }

        if [[ -n "$KEYSTORE_BASE64" ]]; then
          : "${KEY_ALIAS:?key_alias is required with keystore_base64}"
          : "${KEYSTORE_PASSWORD:?keystore_password is required with keystore_base64}"
          keystore="$RUNNER_TEMP/commonwork-android.keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          {
            echo "COMMONWORK_ANDROID_MODE=keystore"
            echo "COMMONWORK_ANDROID_KEYSTORE=$(native_path "$keystore")"
            echo "COMMONWORK_ANDROID_ALIAS=$KEY_ALIAS"
            echo "COMMONWORK_ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "COMMONWORK_ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          exit 0
        fi

        [[ -n "$CERTIFICATE_PEM" && -n "$PRIVATE_KEY_PEM" ]] || {
          echo "Provide either keystore_base64 or both certificate_pem and private_key_pem." >&2
          exit 2
        }

        tmpdir="$(mktemp -d "$RUNNER_TEMP/android-signing.XXXXXX")"
        trap 'rm -rf "$tmpdir"' EXIT
        write_secret() {
          local value="$1" destination="$2"
          if [[ "$value" == *"-----BEGIN"* ]]; then
            printf '%s\n' "$value" > "$destination"
          elif ! printf '%s' "$value" | base64 --decode > "$destination" 2>/dev/null; then
            printf '%s\n' "$value" > "$destination"
          fi
        }

        write_secret "$PRIVATE_KEY_PEM" "$tmpdir/key.pem"
        write_secret "$CERTIFICATE_PEM" "$tmpdir/cert.pem"

        key_path="$RUNNER_TEMP/commonwork-android-signing-key.pk8"
        cert_path="$RUNNER_TEMP/commonwork-android-signing-cert.pem"
        passin_args=()
        if [[ -n "$PRIVATE_KEY_PASSWORD" ]]; then
          passin_args=(-passin "pass:$PRIVATE_KEY_PASSWORD")
        fi

        openssl pkcs8 -topk8 -inform PEM -outform DER \
          -in "$tmpdir/key.pem" \
          -out "$key_path" \
          -nocrypt \
          "${passin_args[@]}"
        cp "$tmpdir/cert.pem" "$cert_path"

        {
          echo "COMMONWORK_ANDROID_MODE=pem"
          echo "COMMONWORK_ANDROID_KEY=$(native_path "$key_path")"
          echo "COMMONWORK_ANDROID_CERT=$(native_path "$cert_path")"
        } >> "$GITHUB_ENV"

    - name: Align, sign, and verify APK
      if: runner.os != 'Windows'
      shell: bash
      env:
        INPUT_APK: ${{ inputs.apk }}
        OUTPUT_APK: ${{ inputs.output }}
        EXPECTED_CERT_SHA256: ${{ inputs.expected_cert_sha256 }}
      run: |
        set -euo pipefail
        [[ -f "$INPUT_APK" ]] || { echo "APK not found: $INPUT_APK" >&2; exit 2; }
        sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
        [[ -n "$sdk_root" ]] || { echo "ANDROID_SDK_ROOT/ANDROID_HOME is not set." >&2; exit 2; }

        build_tools="$(find "$sdk_root/build-tools" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -V | tail -1)"
        [[ -n "$build_tools" ]] || { echo "Android build-tools not found." >&2; exit 2; }
        dir="$sdk_root/build-tools/$build_tools"
        zipalign="$dir/zipalign"
        apksigner="$dir/apksigner"

        mkdir -p "$(dirname "$OUTPUT_APK")"
        aligned="$RUNNER_TEMP/commonwork-aligned.apk"
        "$zipalign" -f -p 4 "$INPUT_APK" "$aligned"

        if [[ "$COMMONWORK_ANDROID_MODE" == "keystore" ]]; then
          export COMMONWORK_KS_PASS="$COMMONWORK_ANDROID_KEYSTORE_PASSWORD"
          export COMMONWORK_KEY_PASS="$COMMONWORK_ANDROID_KEY_PASSWORD"
          args=(sign --ks "$COMMONWORK_ANDROID_KEYSTORE" --ks-key-alias "$COMMONWORK_ANDROID_ALIAS" --ks-pass env:COMMONWORK_KS_PASS)
          if [[ -n "$COMMONWORK_ANDROID_KEY_PASSWORD" ]]; then
            args+=(--key-pass env:COMMONWORK_KEY_PASS)
          fi
          "$apksigner" "${args[@]}" --out "$OUTPUT_APK" "$aligned"
        else
          "$apksigner" sign --key "$COMMONWORK_ANDROID_KEY" --cert "$COMMONWORK_ANDROID_CERT" --out "$OUTPUT_APK" "$aligned"
        fi

        verify_output="$("$apksigner" verify --verbose --print-certs "$OUTPUT_APK")"
        printf '%s\n' "$verify_output"
        if [[ -n "$EXPECTED_CERT_SHA256" ]]; then
          actual="$(printf '%s\n' "$verify_output" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          expected="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          [[ -n "$actual" && "$actual" == "$expected" ]] || {
            echo "APK signer certificate does not match expected_cert_sha256." >&2
            exit 1
          }
        fi
        test -s "$OUTPUT_APK"

    - name: Align, sign, and verify APK on Windows
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        INPUT_APK: ${{ inputs.apk }}
        OUTPUT_APK: ${{ inputs.output }}
        EXPECTED_CERT_SHA256: ${{ inputs.expected_cert_sha256 }}
      run: |
        $ErrorActionPreference = 'Stop'

        if (-not (Test-Path $env:INPUT_APK)) {
          throw "APK not found: $env:INPUT_APK"
        }

        $sdkRoot = if ($env:ANDROID_SDK_ROOT) { $env:ANDROID_SDK_ROOT } elseif ($env:ANDROID_HOME) { $env:ANDROID_HOME } else { $null }
        if (-not $sdkRoot) { throw 'ANDROID_SDK_ROOT/ANDROID_HOME is not set.' }

        $buildToolsDir = Get-ChildItem -Path (Join-Path $sdkRoot 'build-tools') -Directory |
          Sort-Object Name -Descending |
          Select-Object -First 1
        if (-not $buildToolsDir) { throw 'Android SDK build-tools directory could not be located.' }

        $zipalign = Join-Path $buildToolsDir.FullName 'zipalign.exe'
        $apksigner = Join-Path $buildToolsDir.FullName 'apksigner.bat'
        if (-not (Test-Path $zipalign)) { throw "zipalign not found at $zipalign" }
        if (-not (Test-Path $apksigner)) { throw "apksigner not found at $apksigner" }

        $outputParent = Split-Path -Parent $env:OUTPUT_APK
        if ($outputParent) { New-Item -ItemType Directory -Force -Path $outputParent | Out-Null }
        $aligned = Join-Path $env:RUNNER_TEMP 'commonwork-aligned.apk'

        & $zipalign -f -p 4 $env:INPUT_APK $aligned
        if ($LASTEXITCODE -ne 0) { throw "zipalign failed with exit code $LASTEXITCODE" }

        if ($env:COMMONWORK_ANDROID_MODE -eq 'keystore') {
          $env:COMMONWORK_KS_PASS = $env:COMMONWORK_ANDROID_KEYSTORE_PASSWORD
          $env:COMMONWORK_KEY_PASS = $env:COMMONWORK_ANDROID_KEY_PASSWORD
          $args = @(
            'sign',
            '--ks', $env:COMMONWORK_ANDROID_KEYSTORE,
            '--ks-key-alias', $env:COMMONWORK_ANDROID_ALIAS,
            '--ks-pass', 'env:COMMONWORK_KS_PASS'
          )
          if ($env:COMMONWORK_ANDROID_KEY_PASSWORD) {
            $args += @('--key-pass', 'env:COMMONWORK_KEY_PASS')
          }
          $args += @('--out', $env:OUTPUT_APK, $aligned)
          & $apksigner @args
        } else {
          & $apksigner sign --key $env:COMMONWORK_ANDROID_KEY --cert $env:COMMONWORK_ANDROID_CERT --out $env:OUTPUT_APK $aligned
        }
        if ($LASTEXITCODE -ne 0) { throw "apksigner failed with exit code $LASTEXITCODE" }

        $verifyOutput = (& $apksigner verify --verbose --print-certs $env:OUTPUT_APK) -join [Environment]::NewLine
        if ($LASTEXITCODE -ne 0) { throw "apksigner verify failed with exit code $LASTEXITCODE" }
        Write-Host $verifyOutput

        if ($env:EXPECTED_CERT_SHA256) {
          $match = [regex]::Match($verifyOutput, 'Signer #1 certificate SHA-256 digest:\s*([0-9A-Fa-f:]+)')
          if (-not $match.Success) { throw 'Could not read APK signer certificate SHA-256 digest.' }
          $actual = $match.Groups[1].Value.Replace(':', '').ToLowerInvariant()
          $expected = ($env:EXPECTED_CERT_SHA256 -replace '[:\s]', '').ToLowerInvariant()
          if ($actual -ne $expected) {
            throw 'APK signer certificate does not match expected_cert_sha256.'
          }
        }

        $signed = Get-Item $env:OUTPUT_APK
        if ($signed.Length -le 0) { throw "Signed APK is empty: $env:OUTPUT_APK" }

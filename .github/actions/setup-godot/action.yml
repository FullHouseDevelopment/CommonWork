name: Set up Godot
description: Install and cache the requested Godot editor build and expose its binary and matching export-template metadata.
inputs:
  godot_version:
    description: Godot version, for example 4.7.2.
    required: false
    default: '4.7.2'
  dotnet:
    description: Use the Godot .NET/Mono editor build.
    required: false
    default: 'false'
  cache:
    description: Cache the downloaded Godot editor.
    required: false
    default: 'true'
outputs:
  binary:
    description: Absolute path to the Godot executable.
    value: ${{ steps.resolve.outputs.binary }}
  templates_url:
    description: URL of the matching export templates archive.
    value: ${{ steps.resolve.outputs.templates_url }}
  template_dir:
    description: Godot export-template directory name.
    value: ${{ steps.resolve.outputs.template_dir }}
runs:
  using: composite
  steps:
    - name: Cache Godot editor
      if: inputs.cache == 'true'
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: ${{ runner.temp }}/godot
        key: ${{ runner.os }}-godot-editor-${{ inputs.godot_version }}-${{ inputs.dotnet }}

    - name: Resolve Godot editor
      id: resolve
      shell: bash
      env:
        GODOT_VERSION: ${{ inputs.godot_version }}
        GODOT_DOTNET: ${{ inputs.dotnet }}
      run: |
        set -euo pipefail
        archive="$RUNNER_TEMP/godot.zip"
        install_dir="$RUNNER_TEMP/godot"
        mkdir -p "$install_dir"

        if [[ "$GODOT_DOTNET" == "true" ]]; then
          editor_archive="Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip"
          editor_binary="Godot_v${GODOT_VERSION}-stable_mono_linux.x86_64"
          templates_archive="Godot_v${GODOT_VERSION}-stable_mono_export_templates.tpz"
          template_dir="${GODOT_VERSION}.stable.mono"
        else
          editor_archive="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          editor_binary="Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          templates_archive="Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          template_dir="${GODOT_VERSION}.stable"
        fi

        base="https://godot-releases.nbg1.your-objectstorage.com/${GODOT_VERSION}-stable"
        godot="$(find "$install_dir" -type f -name "$editor_binary" -print -quit || true)"
        if [[ -z "$godot" ]]; then
          curl -fL --retry 3 "$base/$editor_archive" -o "$archive"
          unzip -q "$archive" -d "$install_dir"
          godot="$(find "$install_dir" -type f -name "$editor_binary" -print -quit)"
        fi

        test -n "$godot"
        chmod +x "$godot"

        {
          echo "binary=$godot"
          echo "templates_url=$base/$templates_archive"
          echo "template_dir=$template_dir"
        } >> "$GITHUB_OUTPUT"

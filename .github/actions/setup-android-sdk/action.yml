name: Set up Android SDK
description: Set up Java and ensure the Android SDK platform/build-tools required by packaging or signing are installed and cached.
inputs:
  java_distribution:
    required: false
    default: microsoft
  java_version:
    required: false
    default: '17'
  build_tools_version:
    required: false
    default: '36.1.0'
  platform_version:
    required: false
    default: '36'
  accept_licenses:
    required: false
    default: 'true'
  cache:
    description: Cache Android SDK packages installed by this action.
    required: false
    default: 'true'
outputs:
  build_tools_dir:
    description: Absolute Android build-tools directory.
    value: ${{ steps.result.outputs.build_tools_dir }}
runs:
  using: composite
  steps:
    - name: Set up Java
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
      with:
        distribution: ${{ inputs.java_distribution }}
        java-version: ${{ inputs.java_version }}

    - name: Resolve Android SDK root
      id: root
      shell: bash
      run: |
        set -euo pipefail
        sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
        [[ -n "$sdk_root" ]] || {
          echo "ANDROID_SDK_ROOT/ANDROID_HOME is not set." >&2
          exit 2
        }
        echo "path=$sdk_root" >> "$GITHUB_OUTPUT"

    - name: Cache Android SDK packages
      id: sdk-cache
      if: inputs.cache == 'true'
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: |
          ${{ steps.root.outputs.path }}/platform-tools
          ${{ steps.root.outputs.path }}/build-tools/${{ inputs.build_tools_version }}
          ${{ steps.root.outputs.path }}/platforms/android-${{ inputs.platform_version }}
          ${{ steps.root.outputs.path }}/licenses
        key: ${{ runner.os }}-${{ runner.arch }}-android-sdk-build-tools-${{ inputs.build_tools_version }}-platform-${{ inputs.platform_version }}

    - name: Install Android SDK packages
      if: inputs.cache != 'true' || steps.sdk-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        SDK_ROOT: ${{ steps.root.outputs.path }}
        BUILD_TOOLS_VERSION: ${{ inputs.build_tools_version }}
        PLATFORM_VERSION: ${{ inputs.platform_version }}
        ACCEPT_LICENSES: ${{ inputs.accept_licenses }}
      run: |
        set -euo pipefail

        sdkmanager="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
        if [[ ! -x "$sdkmanager" ]]; then
          sdkmanager="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
        fi
        [[ -x "$sdkmanager" ]] || {
          echo "Could not locate sdkmanager under $SDK_ROOT/cmdline-tools." >&2
          exit 2
        }

        if [[ "$ACCEPT_LICENSES" == "true" ]]; then
          yes | "$sdkmanager" --licenses >/dev/null || true
        fi

        "$sdkmanager" \
          "platform-tools" \
          "build-tools;$BUILD_TOOLS_VERSION" \
          "platforms;android-$PLATFORM_VERSION"

    - name: Verify Android SDK packages
      id: result
      shell: bash
      env:
        SDK_ROOT: ${{ steps.root.outputs.path }}
        BUILD_TOOLS_VERSION: ${{ inputs.build_tools_version }}
        PLATFORM_VERSION: ${{ inputs.platform_version }}
      run: |
        set -euo pipefail
        build_tools_dir="$SDK_ROOT/build-tools/$BUILD_TOOLS_VERSION"
        platform_dir="$SDK_ROOT/platforms/android-$PLATFORM_VERSION"
        [[ -d "$build_tools_dir" ]] || {
          echo "Build-tools directory not found: $build_tools_dir" >&2
          exit 2
        }
        [[ -d "$platform_dir" ]] || {
          echo "Android platform directory not found: $platform_dir" >&2
          exit 2
        }
        [[ -d "$SDK_ROOT/platform-tools" ]] || {
          echo "Android platform-tools directory not found." >&2
          exit 2
        }
        echo "build_tools_dir=$build_tools_dir" >> "$GITHUB_OUTPUT"

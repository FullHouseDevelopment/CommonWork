name: Set up Python
description: Install Python with optional dependency caching.
inputs:
  python_version:
    description: Python version or range.
    required: true
  cache:
    description: Enable setup-python dependency caching.
    required: false
    default: 'false'
  cache_type:
    description: Cache type supported by setup-python, such as pip, pipenv, or poetry.
    required: false
    default: pip
  cache_dependency_path:
    description: Optional dependency or lockfile path used for cache invalidation.
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Set up Python
      if: inputs.cache != 'true'
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: ${{ inputs.python_version }}

    - name: Set up Python with dependency cache
      if: inputs.cache == 'true'
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: ${{ inputs.python_version }}
        cache: ${{ inputs.cache_type }}
        cache-dependency-path: ${{ inputs.cache_dependency_path }}

name: Reusable composable release pipeline

on:
  workflow_call:
    inputs:
      ref:
        description: Exact caller ref/SHA to validate and package.
        required: false
        type: string
        default: ''

      dotnet:
        description: Run the .NET release-validation job.
        required: false
        type: boolean
        default: false
      dotnet_runner:
        required: false
        type: string
        default: ubuntu-latest
      dotnet_global_json_file:
        required: false
        type: string
        default: global.json
      dotnet_version:
        required: false
        type: string
        default: ''
      dotnet_restore_command:
        required: false
        type: string
        default: dotnet restore
      dotnet_build_command:
        required: false
        type: string
        default: dotnet build --no-restore
      dotnet_test_command:
        required: false
        type: string
        default: dotnet test --no-build --no-restore

      node:
        description: Run the Node/Next.js release-validation job.
        required: false
        type: boolean
        default: false
      node_version:
        required: false
        type: string
        default: '24'
      node_working_directory:
        required: false
        type: string
        default: '.'
      node_package_manager:
        required: false
        type: string
        default: npm
      node_cache_dependency_path:
        required: false
        type: string
        default: package-lock.json
      node_setup_command:
        required: false
        type: string
        default: ''
      node_install_command:
        required: false
        type: string
        default: npm ci
      node_lint_command:
        required: false
        type: string
        default: npm run lint --if-present
      node_typecheck_command:
        required: false
        type: string
        default: ''
      node_test_command:
        required: false
        type: string
        default: npm test --if-present
      node_build_command:
        required: false
        type: string
        default: npm run build

      python:
        description: Run the Python release-validation job.
        required: false
        type: boolean
        default: false
      python_versions:
        required: false
        type: string
        default: '["3.11"]'
      python_working_directory:
        required: false
        type: string
        default: '.'
      python_cache:
        required: false
        type: boolean
        default: true
      python_cache_type:
        required: false
        type: string
        default: pip
      python_cache_dependency_path:
        required: false
        type: string
        default: ''
      python_install_command:
        required: false
        type: string
        default: ''
      python_lint_command:
        required: false
        type: string
        default: ''
      python_typecheck_command:
        required: false
        type: string
        default: ''
      python_test_command:
        required: false
        type: string
        default: pytest
      python_package_command:
        required: false
        type: string
        default: ''

      godot:
        description: Run the Godot release-validation/export job.
        required: false
        type: boolean
        default: false
      godot_version:
        required: false
        type: string
        default: '4.7.2'
      godot_dotnet:
        required: false
        type: boolean
        default: false
      godot_dotnet_version:
        required: false
        type: string
        default: ''
      godot_working_directory:
        required: false
        type: string
        default: '.'
      godot_setup_command:
        required: false
        type: string
        default: ''
      godot_dotnet_build_command:
        required: false
        type: string
        default: ''
      godot_runtime_smoke:
        required: false
        type: boolean
        default: true
      godot_export_preset:
        required: false
        type: string
        default: ''
      godot_export_output:
        required: false
        type: string
        default: ''
      godot_export_debug:
        required: false
        type: boolean
        default: false
      godot_upload_artifact:
        required: false
        type: boolean
        default: true
      godot_artifact_name:
        required: false
        type: string
        default: godot-release
    secrets:
      nuget_token:
        required: false

jobs:
  dotnet:
    name: Release / .NET
    if: inputs.dotnet
    uses: $/.github/workflows/profile-dotnet.yml
    with:
      ref: ${{ inputs.ref }}
      tier: heavy
      runner: ${{ inputs.dotnet_runner }}
      global_json_file: ${{ inputs.dotnet_global_json_file }}
      dotnet_version: ${{ inputs.dotnet_version }}
      restore_command: ${{ inputs.dotnet_restore_command }}
      build_command: ${{ inputs.dotnet_build_command }}
      test_command: ${{ inputs.dotnet_test_command }}
    secrets:
      nuget_token: ${{ secrets.nuget_token }}

  node:
    name: Release / Node
    if: inputs.node
    uses: $/.github/workflows/profile-node-next.yml
    with:
      ref: ${{ inputs.ref }}
      tier: heavy
      node_version: ${{ inputs.node_version }}
      working_directory: ${{ inputs.node_working_directory }}
      package_manager: ${{ inputs.node_package_manager }}
      cache_dependency_path: ${{ inputs.node_cache_dependency_path }}
      setup_command: ${{ inputs.node_setup_command }}
      install_command: ${{ inputs.node_install_command }}
      lint_command: ${{ inputs.node_lint_command }}
      typecheck_command: ${{ inputs.node_typecheck_command }}
      test_command: ${{ inputs.node_test_command }}
      build_command: ${{ inputs.node_build_command }}

  python:
    name: Release / Python
    if: inputs.python
    uses: $/.github/workflows/profile-python.yml
    with:
      ref: ${{ inputs.ref }}
      tier: heavy
      python_versions: ${{ inputs.python_versions }}
      working_directory: ${{ inputs.python_working_directory }}
      cache: ${{ inputs.python_cache }}
      cache_type: ${{ inputs.python_cache_type }}
      cache_dependency_path: ${{ inputs.python_cache_dependency_path }}
      install_command: ${{ inputs.python_install_command }}
      lint_command: ${{ inputs.python_lint_command }}
      typecheck_command: ${{ inputs.python_typecheck_command }}
      test_command: ${{ inputs.python_test_command }}
      package_command: ${{ inputs.python_package_command }}

  godot:
    name: Release / Godot
    if: inputs.godot
    uses: $/.github/workflows/profile-godot.yml
    permissions:
      contents: write
    with:
      ref: ${{ inputs.ref }}
      tier: heavy
      godot_version: ${{ inputs.godot_version }}
      dotnet: ${{ inputs.godot_dotnet }}
      dotnet_version: ${{ inputs.godot_dotnet_version }}
      working_directory: ${{ inputs.godot_working_directory }}
      setup_command: ${{ inputs.godot_setup_command }}
      dotnet_build_command: ${{ inputs.godot_dotnet_build_command }}
      runtime_smoke: ${{ inputs.godot_runtime_smoke }}
      export_preset: ${{ inputs.godot_export_preset }}
      export_output: ${{ inputs.godot_export_output }}
      export_debug: ${{ inputs.godot_export_debug }}
      upload_artifact: ${{ inputs.godot_upload_artifact && inputs.godot_export_preset != '' }}
      artifact_name: ${{ inputs.godot_artifact_name }}

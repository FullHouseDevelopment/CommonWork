name: Reusable CI profile - Godot

on:
  workflow_call:
    inputs:
      ref:
        description: Exact caller ref/SHA to validate
        required: false
        type: string
        default: ''
      godot_version:
        description: Godot version, e.g. 4.7.2
        required: false
        type: string
        default: '4.7.2'
      dotnet:
        description: Use the Godot .NET/Mono editor build
        required: false
        type: boolean
        default: false
      dotnet_version:
        description: Optional .NET SDK version/range for Godot C# projects
        required: false
        type: string
        default: ''
      cache:
        description: Cache Godot editor/templates and NuGet packages
        required: false
        type: boolean
        default: true
      working_directory:
        description: Godot project directory
        required: false
        type: string
        default: '.'
      setup_command:
        description: Optional caller-specific setup before validation/export
        required: false
        type: string
        default: ''
      dotnet_build_command:
        description: Optional caller-specific .NET build command
        required: false
        type: string
        default: ''
      editor_import:
        description: Open/import the project headlessly in the editor
        required: false
        type: boolean
        default: true
      runtime_smoke:
        description: Run the main scene headlessly after import
        required: false
        type: boolean
        default: false
      runtime_seconds:
        description: Headless runtime-smoke duration
        required: false
        type: number
        default: 3
      export_preset:
        description: Optional Godot export preset name
        required: false
        type: string
        default: ''
      export_output:
        description: Output path for export_preset; required when export_preset is set
        required: false
        type: string
        default: ''
      export_debug:
        description: Use --export-debug instead of --export-release
        required: false
        type: boolean
        default: true
      upload_artifact:
        description: Upload export_output as a workflow artifact
        required: false
        type: boolean
        default: false
      artifact_name:
        description: Artifact name when upload_artifact is enabled
        required: false
        type: string
        default: godot-export
      artifact_retention_days:
        description: Artifact retention in days
        required: false
        type: number
        default: 3
      artifact_release_fallback:
        description: Fall back to a rolling prerelease asset when Actions artifact upload fails
        required: false
        type: boolean
        default: true
      artifact_release_tag:
        description: Rolling prerelease tag used for artifact-upload fallback
        required: false
        type: string
        default: ci-snapshots

# Token permissions are intentionally inherited from the caller. Normal validation only
# needs contents: read; callers that want release-asset fallback must grant contents: write.

jobs:
  validate:
    name: Godot ${{ inputs.godot_version }} ${{ inputs.dotnet && '.NET' || 'Standard' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Set up .NET
        if: inputs.dotnet && inputs.dotnet_version != ''
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: ${{ inputs.dotnet_version }}

      - name: Cache NuGet packages
        if: inputs.cache && inputs.dotnet
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-godot-nuget-${{ inputs.dotnet_version || 'runner' }}-${{ hashFiles('**/*.csproj', '**/*.fsproj', '**/*.vbproj', '**/*.props', '**/*.targets', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-godot-nuget-${{ inputs.dotnet_version || 'runner' }}-
            ${{ runner.os }}-godot-nuget-

      - name: Cache Godot editor
        if: inputs.cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/godot
          key: ${{ runner.os }}-godot-editor-${{ inputs.godot_version }}-${{ inputs.dotnet && 'mono' || 'standard' }}

      - name: Resolve Godot download
        id: godot
        shell: bash
        env:
          GODOT_VERSION: ${{ inputs.godot_version }}
          GODOT_DOTNET: ${{ inputs.dotnet }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/godot.zip"
          install_dir="$RUNNER_TEMP/godot"
          mkdir -p "$install_dir"

          if [[ "$GODOT_DOTNET" == "true" ]]; then
            editor_archive="Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip"
            editor_binary="Godot_v${GODOT_VERSION}-stable_mono_linux.x86_64"
            templates_archive="Godot_v${GODOT_VERSION}-stable_mono_export_templates.tpz"
          else
            editor_archive="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
            editor_binary="Godot_v${GODOT_VERSION}-stable_linux.x86_64"
            templates_archive="Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          fi

          base="https://godot-releases.nbg1.your-objectstorage.com/${GODOT_VERSION}-stable"
          godot="$(find "$install_dir" -type f -name "$editor_binary" -print -quit || true)"
          if [[ -z "$godot" ]]; then
            curl -fL --retry 3 "$base/$editor_archive" -o "$archive"
            unzip -q "$archive" -d "$install_dir"
            godot="$(find "$install_dir" -type f -name "$editor_binary" -print -quit)"
          fi
          test -n "$godot"
          chmod +x "$godot"

          {
            echo "binary=$godot"
            echo "templates_url=$base/$templates_archive"
            echo "template_dir=${GODOT_VERSION}.stable$([[ "$GODOT_DOTNET" == "true" ]] && echo '.mono')"
          } >> "$GITHUB_OUTPUT"

      - name: Caller-specific setup
        if: inputs.setup_command != ''
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        run: ${{ inputs.setup_command }}

      - name: Build Godot .NET project
        if: inputs.dotnet && inputs.dotnet_build_command != ''
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        run: ${{ inputs.dotnet_build_command }}

      - name: Import project in editor
        if: inputs.editor_import
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        env:
          GODOT: ${{ steps.godot.outputs.binary }}
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/godot-editor.log"
          set +e
          "$GODOT" --headless --path . --editor --quit 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          set -e
          if [[ "$status" -ne 0 ]]; then
            exit "$status"
          fi
          if grep -Eiv 'ERROR: [0-9]+ resources? still in use at exit' "$log" \
            | grep -Eiq 'SCRIPT ERROR|Parse Error|Failed to load script|ERROR:.*(script|resource)'; then
            echo "Godot reported a script/resource validation error." >&2
            exit 1
          fi

      - name: Run headless runtime smoke
        if: inputs.runtime_smoke
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        env:
          GODOT: ${{ steps.godot.outputs.binary }}
          RUNTIME_SECONDS: ${{ inputs.runtime_seconds }}
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/godot-runtime.log"
          set +e
          "$GODOT" --headless --path . --quit-after "$RUNTIME_SECONDS" 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          set -e
          if [[ "$status" -ne 0 ]]; then
            exit "$status"
          fi
          if grep -Eiv 'ERROR: [0-9]+ resources? still in use at exit' "$log" \
            | grep -Eiq 'Unhandled exception|System\.[A-Za-z]+Exception|SCRIPT ERROR|ERROR:.*(script|resource)'; then
            echo "Godot runtime smoke reported an error." >&2
            exit 1
          fi

      - name: Cache matching export templates
        id: godot-templates-cache
        if: inputs.export_preset != '' && inputs.cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.local/share/godot/export_templates
          key: ${{ runner.os }}-godot-templates-${{ inputs.godot_version }}-${{ inputs.dotnet && 'mono' || 'standard' }}

      - name: Install matching export templates
        if: inputs.export_preset != '' && (!inputs.cache || steps.godot-templates-cache.outputs.cache-hit != 'true')
        shell: bash
        env:
          TEMPLATES_URL: ${{ steps.godot.outputs.templates_url }}
          TEMPLATE_DIR: ${{ steps.godot.outputs.template_dir }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/godot-templates.tpz"
          unpacked="$RUNNER_TEMP/godot-templates"
          target="$HOME/.local/share/godot/export_templates/$TEMPLATE_DIR"
          curl -fL --retry 3 "$TEMPLATES_URL" -o "$archive"
          mkdir -p "$unpacked" "$target"
          unzip -q "$archive" -d "$unpacked"
          cp -R "$unpacked/templates/." "$target/"

      - name: Export project
        if: inputs.export_preset != ''
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        env:
          GODOT: ${{ steps.godot.outputs.binary }}
          PRESET: ${{ inputs.export_preset }}
          OUTPUT: ${{ inputs.export_output }}
          EXPORT_DEBUG: ${{ inputs.export_debug }}
        run: |
          set -euo pipefail
          [[ -n "$OUTPUT" ]] || {
            echo "export_output is required when export_preset is configured." >&2
            exit 2
          }
          mkdir -p "$(dirname "$OUTPUT")"
          if [[ "$EXPORT_DEBUG" == "true" ]]; then
            mode="--export-debug"
          else
            mode="--export-release"
          fi
          "$GODOT" --headless --path . "$mode" "$PRESET" "$OUTPUT"
          test -s "$OUTPUT"

      - name: Upload export artifact
        id: upload-export-artifact
        if: inputs.export_preset != '' && inputs.upload_artifact
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ inputs.working_directory }}/${{ inputs.export_output }}
          if-no-files-found: error
          retention-days: ${{ inputs.artifact_retention_days }}

      - name: Fall back to release asset storage
        id: fallback-export-artifact
        if: inputs.export_preset != '' && inputs.upload_artifact && steps.upload-export-artifact.outcome == 'failure' && inputs.artifact_release_fallback
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FALLBACK_TAG: ${{ inputs.artifact_release_tag }}
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
          EXPORT_PATH: ${{ inputs.working_directory }}/${{ inputs.export_output }}
        run: |
          set -euo pipefail
          test -s "$EXPORT_PATH"

          base="$(basename "$EXPORT_PATH")"
          if [[ "$base" == *.* && "$base" != .* ]]; then
            extension=".${base##*.}"
          else
            extension=""
          fi
          safe_name="$(printf '%s' "$ARTIFACT_NAME" | tr -cs 'A-Za-z0-9._-' '-' | sed 's/^-*//; s/-*$//')"
          [[ -n "$safe_name" ]] || safe_name="godot-export"
          fallback_name="${safe_name}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}${extension}"
          fallback_path="$RUNNER_TEMP/$fallback_name"
          cp "$EXPORT_PATH" "$fallback_path"

          if ! gh release view "$FALLBACK_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$FALLBACK_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "CI snapshot storage" \
              --notes "Rolling prerelease used only when GitHub Actions artifact storage is unavailable." \
              --prerelease \
              --target "$GITHUB_SHA" \
            || gh release view "$FALLBACK_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          fi

          gh release upload "$FALLBACK_TAG" "$fallback_path" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${FALLBACK_TAG}/${fallback_name}"
          echo "download_url=$url" >> "$GITHUB_OUTPUT"
          {
            echo "### Artifact storage fallback"
            echo
            echo "Actions artifact upload failed; stored the export as a release asset instead."
            echo
            echo "- Download: [$fallback_name]($url)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Require export artifact to be stored
        if: >-
          always() &&
          inputs.export_preset != '' &&
          inputs.upload_artifact &&
          steps.upload-export-artifact.outcome == 'failure' &&
          (!inputs.artifact_release_fallback || steps.fallback-export-artifact.outcome != 'success')
        shell: bash
        run: |
          echo "The export succeeded, but neither Actions artifact storage nor release fallback storage succeeded." >&2
          exit 1
      - name: Summarize Godot profile
        if: always()
        shell: bash
        run: |
          {
            echo "### Shared Godot CI profile"
            echo
            echo "- Godot: \`${{ inputs.godot_version }}\`"
            echo "- .NET editor: \`${{ inputs.dotnet }}\`"
            echo "- Dependency/tool cache: \`${{ inputs.cache }}\`"
            echo "- Editor import: \`${{ inputs.editor_import }}\`"
            echo "- Runtime smoke: \`${{ inputs.runtime_smoke }}\`"
            echo "- Export preset: \`${{ inputs.export_preset || '(none)' }}\`"
            echo "- Upload export: \`${{ inputs.upload_artifact }}\`"
            echo "- Release fallback: \`${{ inputs.artifact_release_fallback }}\`"
            if [[ -n "${{ steps.fallback-export-artifact.outputs.download_url }}" ]]; then
              echo "- Fallback download: ${{ steps.fallback-export-artifact.outputs.download_url }}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

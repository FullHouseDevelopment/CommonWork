name: Reusable CI profile - Godot

on:
  workflow_call:
    inputs:
      ref:
        description: Exact caller ref/SHA to validate
        required: false
        type: string
        default: ''
      tier:
        description: Validation tier. light builds/imports; heavy enables runtime/export work.
        required: false
        type: string
        default: light
      runner:
        description: Linux runner label
        required: false
        type: string
        default: ubuntu-latest
      godot_version:
        description: Godot version, e.g. 4.7.2
        required: false
        type: string
        default: '4.7.2'
      dotnet:
        description: Use the Godot .NET/Mono editor build
        required: false
        type: boolean
        default: false
      dotnet_version:
        description: Optional .NET SDK version/range for Godot C# projects
        required: false
        type: string
        default: ''
      cache:
        description: Cache Godot editor/templates and NuGet packages
        required: false
        type: boolean
        default: true
      working_directory:
        description: Godot project directory
        required: false
        type: string
        default: '.'
      setup_command:
        description: Optional caller-specific setup before validation/export
        required: false
        type: string
        default: ''
      dotnet_build_command:
        description: Optional caller-specific .NET build command
        required: false
        type: string
        default: ''
      editor_import:
        description: Open/import the project headlessly in the editor
        required: false
        type: boolean
        default: true
      runtime_smoke:
        description: Run the main scene headlessly after import
        required: false
        type: boolean
        default: false
      runtime_smoke_in_light:
        description: Allow runtime_smoke during light development CI
        required: false
        type: boolean
        default: false
      runtime_seconds:
        description: Headless runtime-smoke duration
        required: false
        type: number
        default: 3
      export_preset:
        description: Optional Godot export preset name
        required: false
        type: string
        default: ''
      export_output:
        description: Output path for export_preset; required when export_preset is set
        required: false
        type: string
        default: ''
      export_debug:
        description: Use --export-debug instead of --export-release
        required: false
        type: boolean
        default: true
      export_in_light:
        description: Allow export work during light CI, for explicit snapshot requests
        required: false
        type: boolean
        default: false
      upload_artifact:
        description: Upload export_output as a workflow artifact
        required: false
        type: boolean
        default: false
      artifact_name:
        description: Artifact name when upload_artifact is enabled
        required: false
        type: string
        default: godot-export
      artifact_retention_days:
        description: Artifact retention in days
        required: false
        type: number
        default: 3
      artifact_release_fallback:
        description: Fall back to a rolling prerelease asset when Actions artifact upload fails
        required: false
        type: boolean
        default: true
      artifact_release_tag:
        description: Rolling prerelease tag used for artifact-upload fallback
        required: false
        type: string
        default: ci-snapshots

# Release fallback needs contents: write. Reusable-workflow permissions cannot
# elevate a caller token, so callers that cap this job at contents: read still
# need to opt into contents: write when they want fallback storage.
jobs:
  validate:
    name: Godot ${{ inputs.godot_version }} ${{ inputs.dotnet && '.NET' || 'Standard' }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 45

    steps:
      - name: Check out caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Set up .NET
        if: inputs.dotnet && inputs.dotnet_version != ''
        uses: $/.github/actions/setup-dotnet
        with:
          global_json_file: ''
          dotnet_version: ${{ inputs.dotnet_version }}
          cache: 'false'

      - name: Cache NuGet packages
        if: inputs.cache && inputs.dotnet
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-godot-nuget-${{ inputs.dotnet_version || 'runner' }}-${{ hashFiles('**/*.csproj', '**/*.fsproj', '**/*.vbproj', '**/*.props', '**/*.targets', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-godot-nuget-${{ inputs.dotnet_version || 'runner' }}-
            ${{ runner.os }}-godot-nuget-

      - name: Set up Godot
        if: inputs.editor_import || (inputs.runtime_smoke && (inputs.tier == 'heavy' || inputs.runtime_smoke_in_light)) || (inputs.export_preset != '' && (inputs.tier == 'heavy' || inputs.export_in_light))
        id: godot
        uses: $/.github/actions/setup-godot
        with:
          godot_version: ${{ inputs.godot_version }}
          dotnet: ${{ inputs.dotnet }}
          cache: ${{ inputs.cache }}

      - name: Caller-specific setup
        if: inputs.setup_command != ''
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        run: ${{ inputs.setup_command }}

      - name: Build Godot .NET project
        if: inputs.dotnet && inputs.dotnet_build_command != ''
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        run: ${{ inputs.dotnet_build_command }}

      - name: Import project in editor
        if: inputs.editor_import
        uses: $/.github/actions/godot-import
        with:
          godot: ${{ steps.godot.outputs.binary }}
          working_directory: ${{ inputs.working_directory }}

      - name: Run headless runtime smoke
        if: inputs.runtime_smoke && (inputs.tier == 'heavy' || inputs.runtime_smoke_in_light)
        uses: $/.github/actions/godot-runtime-smoke
        with:
          godot: ${{ steps.godot.outputs.binary }}
          working_directory: ${{ inputs.working_directory }}
          runtime_seconds: ${{ inputs.runtime_seconds }}

      - name: Install matching export templates
        if: inputs.export_preset != '' && (inputs.tier == 'heavy' || inputs.export_in_light)
        uses: $/.github/actions/install-godot-templates
        with:
          godot_version: ${{ inputs.godot_version }}
          dotnet: ${{ inputs.dotnet }}
          cache: ${{ inputs.cache }}

      - name: Export project
        if: inputs.export_preset != '' && (inputs.tier == 'heavy' || inputs.export_in_light)
        uses: $/.github/actions/godot-export
        with:
          godot: ${{ steps.godot.outputs.binary }}
          working_directory: ${{ inputs.working_directory }}
          preset: ${{ inputs.export_preset }}
          output: ${{ inputs.export_output }}
          debug: ${{ inputs.export_debug }}

      - name: Store export artifact
        id: store-export-artifact
        if: inputs.export_preset != '' && (inputs.tier == 'heavy' || inputs.export_in_light) && inputs.upload_artifact
        uses: $/.github/actions/upload-artifact-with-fallback
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ inputs.working_directory }}/${{ inputs.export_output }}
          retention_days: ${{ inputs.artifact_retention_days }}
          fallback: ${{ inputs.artifact_release_fallback }}
          fallback_tag: ${{ inputs.artifact_release_tag }}
          github_token: ${{ github.token }}

      - name: Summarize Godot profile
        if: always()
        shell: bash
        run: |
          {
            echo "### Shared Godot CI profile"
            echo
            echo "- Godot: \`${{ inputs.godot_version }}\`"
            echo "- .NET editor: \`${{ inputs.dotnet }}\`"
            echo "- Dependency/tool cache: \`${{ inputs.cache }}\`"
            echo "- Editor import: \`${{ inputs.editor_import }}\`"
            echo "- Runtime smoke: \`${{ inputs.runtime_smoke }}\`"
            echo "- Export preset: \`${{ inputs.export_preset || '(none)' }}\`"
            echo "- Upload export: \`${{ inputs.upload_artifact }}\`"
            echo "- Release fallback: \`${{ inputs.artifact_release_fallback }}\`"
            if [[ -n "${{ steps.store-export-artifact.outputs.fallback_url }}" ]]; then
              echo "- Fallback download: ${{ steps.store-export-artifact.outputs.fallback_url }}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

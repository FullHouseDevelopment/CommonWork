name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: common-work-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lean:
    name: Lean shared-workflow validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'

      - name: Run shared action tests
        run: |
          node --test .github/actions/version-policy/index.test.js
          node --test .github/actions/workflow-policy/index.test.js

      - name: Validate workflow policy
        uses: ./.github/actions/workflow-policy
        with:
          workflows-path: .github/workflows
          require-concurrency: true

      - name: Install actionlint
        shell: bash
        env:
          ACTIONLINT_VERSION: v1.7.12
        run: |
          set -euo pipefail
          export GOBIN="$RUNNER_TEMP/actionlint-bin"
          mkdir -p "$GOBIN"
          go install "github.com/rhysd/actionlint/cmd/actionlint@${ACTIONLINT_VERSION}"

      - name: Lint workflows
        shell: bash
        run: |
          # actionlint v1.7.12 predates GitHub's $/ self-repository syntax.
          "$RUNNER_TEMP/actionlint-bin/actionlint" -color \
            -ignore 'invalid format because ref is missing' \
            -ignore 'not following the format .* nor "./path/to/workflow.yml"'

      - name: Validate composite action manifests
        shell: bash
        run: |
          ruby -e 'require "yaml"; Dir[".github/actions/*/action.{yml,yaml}"].sort.each { |path| YAML.load_file(path); puts "validated #{path}" }'

  snapshot-intent-selftest:
    name: Snapshot intent main-only self-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: $/.github/workflows/snapshot-intent.yml
    with:
      pr_body: '+snapshot'
    permissions:
      contents: read
      pull-requests: read

  godot-profile-selftest:
    name: Godot profile main-only self-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: $/.github/workflows/profile-godot.yml
    with:
      ref: ${{ github.sha }}
      tier: light
      godot_version: '4.7.2'
      dotnet: false
      editor_import: false
      runtime_smoke: false
    permissions:
      contents: write

  maui-profile-selftest:
    name: MAUI profile main-only self-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: $/.github/workflows/profile-maui.yml
    with:
      ref: ${{ github.sha }}
      tier: light
      global_json_file: ''
      dotnet_version: '10.0.x'
      headless_enabled: true
      headless_restore_command: echo restore-ok
      headless_build_command: echo build-ok
      headless_test_command: echo test-ok
      android_enabled: false
      windows_enabled: false
    permissions:
      contents: read
      packages: read

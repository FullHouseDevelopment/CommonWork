name: Reusable snapshot intent

on:
  workflow_call:
    inputs:
      pr_body:
        description: Compatibility fallback PR body when no PR number is available
        required: false
        type: string
        default: ''
      pr_number:
        description: Pull request number used to fetch the current authoritative PR metadata
        required: false
        type: number
        default: 0
    outputs:
      requested:
        description: Whether the PR body contains exactly one +snapshot directive
        value: ${{ jobs.snapshot.outputs.requested }}

permissions:
  contents: read
  pull-requests: read

jobs:
  snapshot:
    name: Resolve snapshot intent
    runs-on: ubuntu-latest
    outputs:
      requested: ${{ steps.intent.outputs.requested }}

    steps:
      - name: Resolve current pull request metadata
        id: pr
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number || 0 }}
          FALLBACK_BODY: ${{ inputs.pr_body }}
        run: |
          set -euo pipefail
          body="$FALLBACK_BODY"
          if [[ "$PR_NUMBER" != "0" ]]; then
            if ! pr_json="$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER")"; then
              echo "::error::Snapshot intent could not read current PR #$PR_NUMBER. Grant pull-requests: read to the caller job."
              exit 1
            fi
            body="$(jq -r '.body // ""' <<<"$pr_json")"
          fi

          delimiter="SNAPSHOT_PR_BODY_$(python -c 'import uuid; print(uuid.uuid4().hex)')"
          {
            echo "body<<$delimiter"
            printf '%s\n' "$body"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve +snapshot directive
        id: intent
        shell: bash
        env:
          PR_BODY: ${{ steps.pr.outputs.body }}
        run: |
          set -euo pipefail
          count="$(printf '%s\n' "$PR_BODY" | grep -Eic '^[[:space:]]*\+snapshot[[:space:]]*$' || true)"

          if (( count > 1 )); then
            echo "::error::Duplicate +snapshot directives are not allowed."
            exit 1
          fi

          requested=false
          if (( count == 1 )); then
            requested=true
          fi

          echo "requested=$requested" >> "$GITHUB_OUTPUT"

          {
            echo "### Snapshot intent"
            echo
            echo "- Snapshot requested: `$requested`"
            echo
            echo "Add a line containing exactly `+snapshot` to the PR body to publish snapshot artifacts."
          } >> "$GITHUB_STEP_SUMMARY"
